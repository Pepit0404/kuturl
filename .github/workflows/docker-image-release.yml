name: Build and publish docker image from the release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract lowercase repository name
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.repo }}-api:latest

      - name: Build and push fontend image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.repo }}-frontend:latest

      - name: Save Docker image
        run: |
          docker save \
            kuturl-api:${{ steps.version.outputs.version }} \
            | gzip > api-v${{ steps.version.outputs.version }}.tar.gz

          docker save \
            kuturl-frontend:${{ steps.version.outputs.version }} \
            | gzip > frontend-v${{ steps.version.outputs.version }}.tar.gz

      - name: Attach Docker image to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "api-v${{ steps.version.outputs.version }}.tar.gz" \
            "frontend-v${{ steps.version.outputs.version }}.tar.gz" \
            --clobber
