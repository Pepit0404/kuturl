services:
  db:
    image: mysql:8.0
    container_name: kuturl_db
    environment:
      MYSQL_USER: ${DB_USER:-kuturl}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-kuturl}
    restart: unless-stopped
    volumes:
      - kuturl-data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-3366}:3306"
    networks:
      - kuturl_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

  api:
    container_name: kuturl_api
    build: api/
    environment:
      PORT: ${API_PORT:-4481}
      DB_USER: ${DB_USER:-kuturl}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-kuturl}
      DB_HOST: ${DB_HOST:-kuturl_db}
      DB_PORT: ${DB_PORT:-3306}
    ports:
      - "${API_PORT:-4481}:4481"
    restart: unless-stopped
    networks:
      - kuturl_network
    depends_on: [db]

  front:
    container_name: kuturl_front
    build: web/
    volumes:
      - ./web:/var/www/html:Z
    environment:
      BASEPATH: "${FRONTEND_BASEPATH:-}"
    ports:
      - "${FRONTEND_PORT:-4480}:80"
    restart: unless-stopped
    networks:
      - kuturl_network

networks:
  kuturl_network:
    driver: bridge

volumes:
  kuturl-data:
